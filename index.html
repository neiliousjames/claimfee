<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ASTROD — claim creator fees</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0b0f1a; color:#e8e8ec; font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; display:flex; min-height:100vh; align-items:center; justify-content:center; padding:20px; }
  .card { width:100%; max-width:560px; background:#0f1420; border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:26px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#9aa0ad; font-size:13px; margin-bottom:20px; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-top:1px solid rgba(255,255,255,.07); font-size:13px; }
  .row b { color:#fff; text-align:right; }
  button { width:100%; border:none; border-radius:12px; padding:14px; font:600 14px ui-monospace,monospace; cursor:pointer; margin-top:14px; }
  .primary { background:#c6f10a; color:#0b0f1a; }
  .primary:disabled { opacity:.45; cursor:not-allowed; }
  .ghost { background:transparent; border:1px solid rgba(255,255,255,.15); color:#e8e8ec; }
  .log { margin-top:16px; font-size:12.5px; white-space:pre-wrap; word-break:break-word; background:#0b0f1a; border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:12px; min-height:54px; color:#c8ccd4; }
  .ok { color:#4ade80; } .err { color:#f87171; } .warn { color:#fbbf24; }
  a { color:#8ab4ff; }
</style>
</head>
<body>
  <div class="card">
    <h1>Claim $ASTROD creator fees</h1>
    <div class="sub">Robinhood Chain · use the CREATOR wallet 0xFe02…caf6.</div>

    <div class="row"><span>Coin</span><b>0x8363…7b9B</b></div>
    <div class="row"><span>Must connect</span><b>0xFe02…caf6</b></div>
    <div class="row"><span>Wallet now</span><b id="acct">not connected</b></div>
    <div class="row"><span>Found</span><b id="found">—</b></div>

    <button class="primary" id="connect">Connect wallet</button>
    <button class="primary" id="claim" disabled>Claim fees</button>
    <button class="ghost" id="recheck" style="display:none">Re-scan</button>

    <div class="log" id="log">Switch MetaMask to the creator account 0xFe02…caf6 FIRST, then click “Connect wallet”.</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
  <script>
    const COIN = "0x8363b867548797f8cc217C97FE64cE8fB44a7b9B";
    const CREATOR = "0xFe02FbC9F8dE890FD8FEc81923b47574Ab3acaf6";
    const TARGETS = [
      { name: "feeEscrow", addr: "0xd3AFEB2a57f70eF218Aa82451c51B2fb0416Ac9e" },
      { name: "locker",    addr: "0x267444D099b10fB5Ed7c3Cc7B7c767AdcA574952" },
      { name: "coin",      addr: COIN },
      { name: "factory",   addr: "0x7ed598bcef8bd9edd8c97a195c6d13f40801ec7e" },
    ];
    // arg: "coin" -> coin addr, "me" -> connected addr, "none" -> no argument
    const FNS = [
      {sig:"claim(address)",arg:"coin"},{sig:"claim(address)",arg:"me"},{sig:"claim()",arg:"none"},
      {sig:"claimFees(address)",arg:"coin"},{sig:"claimFees()",arg:"none"},
      {sig:"claimCreatorFees(address)",arg:"coin"},{sig:"claimCreatorFees()",arg:"none"},
      {sig:"claimRewards(address)",arg:"coin"},{sig:"claimRewards()",arg:"none"},
      {sig:"collectFees(address)",arg:"coin"},{sig:"collectFees()",arg:"none"},
      {sig:"collect(address)",arg:"coin"},{sig:"collect()",arg:"none"},
      {sig:"collectCreatorFees(address)",arg:"coin"},{sig:"collectCreatorFees()",arg:"none"},
      {sig:"withdraw(address)",arg:"coin"},{sig:"withdraw()",arg:"none"},
      {sig:"withdrawFees(address)",arg:"coin"},{sig:"withdrawFees()",arg:"none"},
      {sig:"release(address)",arg:"coin"},{sig:"release()",arg:"none"},
    ];
    const CHAIN_HEX = "0x1237";
    const RPC = "https://rpc.mainnet.chain.robinhood.com";
    const EXPLORER = "https://robinhoodchain.blockscout.com";

    const $ = (id) => document.getElementById(id);
    const log = (m, cls="") => { $("log").innerHTML = cls ? `<span class="${cls}">${m}</span>` : m; };
    let signer, me, hit = null;

    function pad(a){ return "000000000000000000000000" + a.slice(2).toLowerCase(); }
    function calldata(fn){
      const sel = ethers.id(fn.sig).slice(0,10);
      if (fn.arg==="coin") return sel + pad(COIN);
      if (fn.arg==="me")   return sel + pad(me);
      return sel;
    }
    async function ensureChain(){
      try { await window.ethereum.request({method:"wallet_switchEthereumChain",params:[{chainId:CHAIN_HEX}]}); }
      catch(e){ if(e.code===4902) await window.ethereum.request({method:"wallet_addEthereumChain",params:[{
        chainId:CHAIN_HEX,chainName:"Robinhood Chain",nativeCurrency:{name:"ETH",symbol:"ETH",decimals:18},rpcUrls:[RPC],blockExplorerUrls:[EXPLORER]}]}); else throw e; }
    }
    async function scan(){
      hit=null; $("claim").disabled=true; $("found").textContent="scanning…";
      const provider=new ethers.BrowserProvider(window.ethereum);
      for (const t of TARGETS){
        const code=await provider.getCode(t.addr); if(!code||code==="0x") continue;
        for (const fn of FNS){
          try { await provider.call({to:t.addr,data:calldata(fn),from:me}); }
          catch(_){ continue; }
          hit={t,fn}; $("found").textContent=`${t.name} · ${fn.sig}`; $("claim").disabled=false;
          log(`Found working claim:\n  contract: ${t.name} (${t.addr})\n  function: ${fn.sig}\nClick “Claim fees”.`,"ok");
          return;
        }
      }
      $("found").textContent="nothing";
      log("Still nothing. Likely the claim needs a different arg. Screenshot the feeEscrow (0xd3AFEB…) Write functions and send them.","err");
    }
    $("connect").onclick=async()=>{
      if(!window.ethereum){ log("No wallet found. Open in Chrome with MetaMask (enable Allow access to file URLs).","err"); return; }
      try{
        await window.ethereum.request({method:"eth_requestAccounts"});
        await ensureChain();
        const provider=new ethers.BrowserProvider(window.ethereum);
        signer=await provider.getSigner(); me=await signer.getAddress();
        $("acct").textContent=me.slice(0,6)+"…"+me.slice(-4);
        $("connect").style.display="none"; $("recheck").style.display="block";
        if(me.toLowerCase()!==CREATOR.toLowerCase()){
          log(`⚠ You are connected as ${me.slice(0,6)}…${me.slice(-4)}, NOT the creator 0xFe02…caf6.\nSwitch account in MetaMask, then click Re-scan. (Scanning anyway…)`,"warn");
        } else { log("Creator wallet OK. Scanning…","warn"); }
        await scan();
      }catch(e){ log(e.message||String(e),"err"); }
    };
    $("recheck").onclick=async()=>{ const p=new ethers.BrowserProvider(window.ethereum); signer=await p.getSigner(); me=await signer.getAddress(); $("acct").textContent=me.slice(0,6)+"…"+me.slice(-4); await scan(); };
    $("claim").onclick=async()=>{
      if(!hit) return;
      try{
        $("claim").disabled=true;
        log(`Sending ${hit.fn.sig} on ${hit.t.name}… confirm in wallet.`,"warn");
        const tx=await signer.sendTransaction({to:hit.t.addr,data:calldata(hit.fn)});
        log(`Submitted: ${tx.hash}\nWaiting…`,"warn");
        const rc=await tx.wait();
        log(`Done! Fees claimed.\nTx: ${EXPLORER}/tx/${rc.hash}`,"ok");
      }catch(e){ $("claim").disabled=false; log("Claim failed: "+(e.shortMessage||e.message||String(e)),"err"); }
    };
  </script>
</body>
</html>
