<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ASTROD — claim creator fees</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0b0f1a; color:#e8e8ec; font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; display:flex; min-height:100vh; align-items:center; justify-content:center; padding:20px; }
  .card { width:100%; max-width:560px; background:#0f1420; border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:26px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#9aa0ad; font-size:13px; margin-bottom:20px; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-top:1px solid rgba(255,255,255,.07); font-size:13px; }
  .row b { color:#fff; text-align:right; }
  button { width:100%; border:none; border-radius:12px; padding:14px; font:600 14px ui-monospace,monospace; cursor:pointer; margin-top:14px; }
  .primary { background:#c6f10a; color:#0b0f1a; }
  .primary:disabled { opacity:.45; cursor:not-allowed; }
  .ghost { background:transparent; border:1px solid rgba(255,255,255,.15); color:#e8e8ec; }
  .log { margin-top:16px; font-size:12.5px; white-space:pre-wrap; word-break:break-word; background:#0b0f1a; border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:12px; min-height:54px; color:#c8ccd4; }
  .ok { color:#4ade80; } .err { color:#f87171; } .warn { color:#fbbf24; }
  a { color:#8ab4ff; }
</style>
</head>
<body>
  <div class="card">
    <h1>Claim $ASTROD creator fees</h1>
    <div class="sub">Robinhood Chain · connect the creator wallet, this finds the claim call for you.</div>

    <div class="row"><span>Coin</span><b>0x8363…7b9B</b></div>
    <div class="row"><span>Creator</span><b>0xFe02…caf6</b></div>
    <div class="row"><span>Wallet</span><b id="acct">not connected</b></div>
    <div class="row"><span>Found</span><b id="found">—</b></div>

    <button class="primary" id="connect">Connect wallet</button>
    <button class="primary" id="claim" disabled>Claim fees</button>
    <button class="ghost" id="recheck" style="display:none">Re-scan</button>

    <div class="log" id="log">Click “Connect wallet”. It switches to Robinhood Chain, then scans the coin + related contracts for the working claim function.</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
  <script>
    const COIN = "0x8363b867548797f8cc217C97FE64cE8fB44a7b9B";
    // Candidate contracts that might hold the position / expose the claim.
    const TARGETS = [
      { name: "coin (self)", addr: COIN },
      { name: "V2-a",        addr: "0x7ed598bcef8bd9edd8c97a195c6d13f40801ec7e" },
      { name: "V2-b",        addr: "0x29ca4540b4c0007e5195c51178928a74d45fdb13" },
      { name: "Active lock", addr: "0x736D76699C26D0d966744cAe304C000d471f7F35" },
      { name: "Legacy lock", addr: "0x31ca5E101941A93A7DD6d0497928700625CF54B5" },
    ];
    // Function signatures to try. useCoin=true appends the coin address as arg.
    const FNS = [
      { sig:"collectFees(address)", useCoin:true },
      { sig:"claimFees(address)",   useCoin:true },
      { sig:"collect(address)",     useCoin:true },
      { sig:"claim(address)",       useCoin:true },
      { sig:"collectCreatorFees(address)", useCoin:true },
      { sig:"collectFees()",        useCoin:false },
      { sig:"claimFees()",          useCoin:false },
      { sig:"claim()",              useCoin:false },
      { sig:"collect()",            useCoin:false },
      { sig:"collectCreatorFees()", useCoin:false },
      { sig:"claimCreatorFees()",   useCoin:false },
    ];
    const CHAIN_HEX = "0x1237";
    const RPC = "https://rpc.mainnet.chain.robinhood.com";
    const EXPLORER = "https://robinhoodchain.blockscout.com";

    const $ = (id) => document.getElementById(id);
    const log = (m, cls="") => { $("log").innerHTML = cls ? `<span class="${cls}">${m}</span>` : m; };
    let signer, me, hit = null;

    function calldata(fn) {
      const sel = ethers.id(fn.sig).slice(0, 10);
      return fn.useCoin ? sel + "000000000000000000000000" + COIN.slice(2).toLowerCase() : sel;
    }

    async function ensureChain() {
      try { await window.ethereum.request({ method:"wallet_switchEthereumChain", params:[{ chainId: CHAIN_HEX }] }); }
      catch (e) {
        if (e.code === 4902) await window.ethereum.request({ method:"wallet_addEthereumChain", params:[{
          chainId: CHAIN_HEX, chainName:"Robinhood Chain",
          nativeCurrency:{ name:"ETH", symbol:"ETH", decimals:18 }, rpcUrls:[RPC], blockExplorerUrls:[EXPLORER] }]});
        else throw e;
      }
    }

    async function scan() {
      hit = null; $("claim").disabled = true; $("found").textContent = "scanning…";
      const provider = new ethers.BrowserProvider(window.ethereum);
      for (const t of TARGETS) {
        const code = await provider.getCode(t.addr);
        if (!code || code === "0x") continue; // no contract here
        for (const fn of FNS) {
          const data = calldata(fn);
          try {
            await provider.call({ to: t.addr, data, from: me }); // reverts if not callable
            hit = { target: t, fn, data };
            $("found").textContent = `${t.name} · ${fn.sig}`;
            $("claim").disabled = false;
            log(`Found a working claim:\n  contract: ${t.name} (${t.addr})\n  function: ${fn.sig}\nClick “Claim fees” to send it.`, "ok");
            return;
          } catch (_) { /* try next */ }
        }
      }
      $("found").textContent = "nothing";
      log("No working claim function found on the known contracts. Screenshot the coin's “Read/Write contract” → Write tab so I can see the exact function name.", "err");
    }

    $("connect").onclick = async () => {
      if (!window.ethereum) { log("No wallet found. Open this file in Chrome with MetaMask (enable “Allow access to file URLs” for MetaMask if needed).", "err"); return; }
      try {
        await window.ethereum.request({ method:"eth_requestAccounts" });
        await ensureChain();
        const provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        me = await signer.getAddress();
        $("acct").textContent = me.slice(0,6) + "…" + me.slice(-4);
        $("connect").style.display = "none";
        $("recheck").style.display = "block";
        log("Scanning contracts + functions…", "warn");
        await scan();
      } catch (e) { log(e.message || String(e), "err"); }
    };
    $("recheck").onclick = scan;

    $("claim").onclick = async () => {
      if (!hit) return;
      try {
        $("claim").disabled = true;
        log(`Sending ${hit.fn.sig} on ${hit.target.name}… confirm in your wallet.`, "warn");
        const tx = await signer.sendTransaction({ to: hit.target.addr, data: hit.data });
        log(`Submitted: ${tx.hash}\nWaiting…`, "warn");
        const rc = await tx.wait();
        log(`Done! Fees claimed.\nTx: ${EXPLORER}/tx/${rc.hash}`, "ok");
      } catch (e) {
        $("claim").disabled = false;
        log("Claim failed: " + (e.shortMessage || e.message || String(e)), "err");
      }
    };
  </script>
</body>
</html>
